# UI
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-ui
  labels:
    app: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: retail-store-ui
          ports:
            - containerPort: 8080
---
